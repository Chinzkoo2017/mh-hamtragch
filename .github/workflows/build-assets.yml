name: Build assets (images, certificates, reel voice-overs)
on:
  push:
    branches: [main]
    paths: ["data/**", "tools/**", ".github/workflows/build-assets.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils ffmpeg
      - run: pip install -q "edge-tts>=7" pillow
      - run: python tools/build.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Build assets: images, certificates, reel audio"
          git pull --rebase origin main
          git push
